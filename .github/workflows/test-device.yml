name: build
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  ci:
    runs-on: self-hosted
    environment:
      ROKU_HOST: "192.168.1.1"
      ROKU_PASSWORD: aaaa
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-node@master
        with:
          node-version: "18.20.4"
          architecture: 'x64' # fix for macos-latest
      - run: npm ci
      - run: npm run build
      - run: npm run test:device
