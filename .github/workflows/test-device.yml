name: build
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  ci:
    runs-on: [self-hosted, roku-latest, enabled]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-node@master
        with:
          node-version: "18.20.4"
      - run: npm ci
      - run: npm run test:device
